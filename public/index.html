<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Label Detector</title>
    <style>
        body {
            margin: 0;
            padding: 40px 16px;
            background: #f3f5f8;
            color: #202532;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #18243a18;
        }

        h1 { margin-top: 0; }
        form { display: grid; gap: 14px; }
        input, button { font: inherit; }
        input[type="file"] { padding: 12px; border: 1px solid #ccd2dc; border-radius: 8px; }
        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #315ee7;
            color: white;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        #result { margin-top: 24px; }
        .result-list { padding-left: 22px; }
        .result-list li { margin: 10px 0; }
        .score { margin-left: 12px; color: #4c5b75; }
        .notice { padding: 14px; background: #fff2e5; border-radius: 8px; }
    </style>
</head>
<body>
<main>
    <h1>Image Label Detector</h1>
    <p>Choose an image to see labels detected by Google Cloud Vision.</p>

    <form id="upload-form"
          action="/analyze"
          method="POST"
          enctype="multipart/form-data">
        <label for="pic">Choose an image file</label>
        <input id="pic" name="pic" type="file" accept="image/*" required>
        <button id="submit-button" type="submit">Detect labels</button>
    </form>

    <div id="result" aria-live="polite"></div>
</main>

<script>
    const form = document.getElementById('upload-form');
    const result = document.getElementById('result');
    const button = document.getElementById('submit-button');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        result.textContent = 'Uploading image and detecting labels…';

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form)
            });

            result.innerHTML = await response.text();
        } catch (error) {
            result.textContent = 'Could not reach the server. Try again.';
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
